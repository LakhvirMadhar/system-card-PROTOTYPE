repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        pass_filenames: false
        types: [python]

      - id: lint-imports
        name: lint-imports
        entry: poetry run lint-imports
        language: system
        pass_filenames: false
        types: [python]
