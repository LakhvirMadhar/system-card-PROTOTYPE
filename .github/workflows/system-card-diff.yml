name: System Card Diff

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare card to latest recorded version (PR preview)
        if: github.event_name == 'pull_request'
        id: preview
        run: poetry run python -m system_card.scripts.record_card_version --dry-run

      - name: Post diff as a PR comment
        if: github.event_name == 'pull_request' && steps.preview.outputs.diff != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ### System card change preview — would mint `${{ steps.preview.outputs.version }}`
            ```
            ${{ steps.preview.outputs.diff }}
            ```

      - name: Record new card version (push to main)
        if: github.event_name == 'push'
        id: record
        run: poetry run python -m system_card.scripts.record_card_version

      - name: Push the new card-vN tag
        if: github.event_name == 'push' && steps.record.outputs.version != ''
        run: git push origin "${{ steps.record.outputs.version }}"
